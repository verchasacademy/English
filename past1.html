<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verchas Academy - Past Tenses (50 Questions)</title>
    <style>
        :root{--primary:#1a237e;--secondary:#ff8f00;--bg-color:#f4f7f6;--card-bg:#ffffff;--text-main:#333333;--border-color:#e0e0e0;}
        body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:var(--bg-color);color:var(--text-main);line-height:1.6;margin:0;padding:0;}
        header{background-color:var(--primary);color:white;padding:1.5rem 1rem;text-align:center;}
        .logo-container{display:flex;align-items:center;justify-content:center;gap:15px;margin-bottom:10px;flex-wrap:wrap;}
        .logo-container img{height:90px;} header h1{margin:0;font-size:clamp(1.5rem,5vw,2.2rem);} header h2{margin:5px 0 0 0;font-size:1.2rem;color:#bbdefb;}
        .container{max-width:850px;margin:20px auto;padding:15px;background:var(--card-bg);border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,0.08);}
        .student-form{background:#e8eaf6;padding:20px;border-radius:8px;margin-bottom:30px;border:2px solid var(--primary);}
        .student-form h3{margin-top:0;color:var(--primary);text-align:center;} .form-row{display:flex;gap:15px;flex-wrap:wrap;}
        .form-group{flex:1;min-width:200px;} .form-group label{display:block;font-weight:bold;margin-bottom:5px;}
        .form-group input,.form-group select{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box;}
        .instructions{background:#fff8e1;padding:15px;border-left:5px solid var(--secondary);margin-bottom:30px;font-size:0.95rem;}
        .question-block{margin-bottom:25px;padding:15px;border:1px solid var(--border-color);border-radius:8px;background-color:#fafafa;}
        .question-text{font-size:1.1rem;font-weight:500;margin-bottom:15px;}
        input.ans-input{padding:8px 12px;font-size:1rem;border:2px solid #ccc;border-radius:4px;width:100%;max-width:220px;font-weight:bold;color:#0d47a1;}
        .action-row{display:flex;align-items:center;gap:15px;margin-top:15px;flex-wrap:wrap;}
        .check-btn{background-color:var(--secondary);color:white;border:none;padding:10px 20px;font-size:1rem;border-radius:5px;cursor:pointer;font-weight:bold;}
        .check-btn:disabled{background-color:#e0e0e0;color:#9e9e9e;cursor:not-allowed;} .feedback{font-size:1.05rem;font-weight:bold;}
        .correct{color:#2e7d32;} .incorrect{color:#c62828;}
        .explanation{display:none;margin-top:15px;padding:15px;background-color:#e3f2fd;border-left:4px solid #1976d2;border-radius:4px;color:#0d47a1;}
        .submit-section{text-align:center;margin-top:40px;padding-top:20px;border-top:2px dashed #ccc;}
        #finalSubmitBtn{background-color:var(--primary);color:white;padding:15px 30px;font-size:1.2rem;border:none;border-radius:8px;cursor:pointer;font-weight:bold;width:100%;max-width:400px;}
        #finalResult{display:none;background-color:#e8f5e9;border:2px solid #4caf50;padding:20px;border-radius:8px;margin-top:20px;} .score-display{font-size:2.5rem;font-weight:bold;color:#1b5e20;}
    </style>
</head>
<body>
    <header>
        <div class="logo-container"><img src="verchas-logo.webp" alt="Verchas Academy Logo"><h1>Verchas Academy, Ayodhya</h1></div>
        <h2>Past Tenses - Mixed Practice (50 Questions)</h2>
    </header>
    <div class="container">
        <div class="student-form">
            <h3>Student Details</h3>
            <div class="form-row">
                <div class="form-group"><label>Full Name</label><input type="text" id="studentName" required></div>
                <div class="form-group"><label>Batch</label><select id="studentBatch" required>
                    <option value="" disabled selected>Select Batch...</option><option value="9th Foundation">9th Foundation</option><option value="10th Foundation">10th Foundation</option><option value="BSc Nursing">BSc Nursing</option>
                </select></div>
                <div class="form-group"><label>Mobile No.</label><input type="tel" id="studentMobile" pattern="[0-9]{10}" maxlength="10" required></div>
            </div>
        </div>
        <div class="instructions"><strong>Instructions:</strong> Type the correct Past Tense form and click <strong>Submit Exam</strong> when finished.</div>
        <div id="questionsContainer"></div>
        <div class="submit-section">
            <button id="finalSubmitBtn" onclick="submitExamData()">Submit Exam & Show Final Score</button>
            <div id="finalResult"></div>
            <!-- Add this new container -->
            <div id="detailedReport" style="display: none; margin-top: 20px; text-align: left;"></div>
        </div>
    </div>
    <script>
        let currentScore = 0; let questionsAttempted = 0;
        
        const expPastIndef = "Past Indefinite (Simple Past): Used for a completed action that happened at a specific time in the past.";
        const expPastCont = "Past Continuous: Used for an action that was ongoing or in progress at a specific time in the past.";
        const expPastPerf = "Past Perfect: Used for an action that was completed before another action or time in the past (clues: already, before).";
        const expPastPerfCont = "Past Perfect Continuous: Used for an action that was ongoing in the past up until another action or time (clues: for/since before another past event).";

        const quizData = [
            { q: "He ________ (go) to the local market yesterday afternoon.", a: ["went"], exp: expPastIndef },
            { q: "I ________ (watch) television when the telephone rang.", a: ["was watching"], exp: expPastCont },
            { q: "She ________ (already / finish) her homework when I called her.", a: ["had already finished"], exp: expPastPerf },
            { q: "They ________ (play) football for two hours before it started raining.", a: ["had been playing"], exp: expPastPerfCont },
            { q: "We ________ (buy) a brand new car last week.", a: ["bought"], exp: expPastIndef },
            { q: "While I ________ (study) for my exams, my brother was playing video games.", a: ["was studying"], exp: expPastCont },
            { q: "The train ________ (leave) the station by the time we arrived.", a: ["had left"], exp: expPastPerf },
            { q: "She was completely exhausted because she ________ (run) for over an hour.", a: ["had been running"], exp: expPastPerfCont },
            { q: "William Shakespeare ________ (write) many famous plays and sonnets.", a: ["wrote"], exp: expPastIndef },
            { q: "At 8 PM last night, we ________ (have) dinner at a restaurant.", a: ["were having"], exp: expPastCont },
            { q: "I suddenly realized I ________ (forget) my house keys at the office.", a: ["had forgotten"], exp: expPastPerf },
            { q: "He ________ (wait) for the bus for 30 minutes when it finally arrived.", a: ["had been waiting"], exp: expPastPerfCont },
            { q: "They ________ (not / know) anything about the surprise party.", a: ["did not know", "didn't know"], exp: expPastIndef },
            { q: "What ________ (you / do) at this exact time yesterday?", a: ["were you doing"], exp: expPastCont },
            { q: "By the year 2010, the author ________ (publish) three successful books.", a: ["had published"], exp: expPastPerf },
            { q: "The ground was soaking wet because it ________ (rain) heavily all night.", a: ["had been raining"], exp: expPastPerfCont },
            { q: "________ (you / see) the evening news on TV last night?", a: ["did you see"], exp: expPastIndef },
            { q: "She ________ (sleep) peacefully when the loud thunder woke her up.", a: ["was sleeping"], exp: expPastCont },
            { q: "I ________ (never / taste) sushi before I visited Japan last year.", a: ["had never tasted"], exp: expPastPerf },
            { q: "We ________ (live) in that small town for five years before moving here.", a: ["had been living"], exp: expPastPerfCont },
            { q: "The ancient Egyptians ________ (build) the Great Pyramids.", a: ["built"], exp: expPastIndef },
            { q: "The children ________ (make) a lot of noise while the teacher was out of the room.", a: ["were making"], exp: expPastCont },
            { q: "When I finally reached the theater, the movie ________ (already / start).", a: ["had already started"], exp: expPastPerf },
            { q: "How long ________ (she / practice) before the grand concert began?", a: ["had she been practicing", "had she been practising"], exp: expPastPerfCont },
            { q: "My grandfather ________ (teach) me how to fish when I was very young.", a: ["taught"], exp: expPastIndef },
            { q: "I ________ (drive) to work when I witnessed a terrible accident.", a: ["was driving"], exp: expPastCont },
            { q: "He ________ (not / hear) the terrible news until I told him myself.", a: ["had not heard", "hadn't heard"], exp: expPastPerf },
            { q: "They ________ (argue) for an hour before they finally agreed on a solution.", a: ["had been arguing"], exp: expPastPerfCont },
            { q: "World War II ________ (end) in the year 1945.", a: ["ended"], exp: expPastIndef },
            { q: "The sun ________ (shine) brightly when we woke up this morning.", a: ["was shining"], exp: expPastCont },
            { q: "We could not get a table at the restaurant because we ________ (not / book) in advance.", a: ["had not booked", "hadn't booked"], exp: expPastPerf },
            { q: "I ________ (try) to fix the leaking sink all morning before calling a professional plumber.", a: ["had been trying"], exp: expPastPerfCont },
            { q: "She accidentally ________ (drop) her expensive phone and the screen broke.", a: ["dropped"], exp: expPastIndef },
            { q: "Why ________ (they / laugh) so loudly during the serious presentation?", a: ["were they laughing"], exp: expPastCont },
            { q: "The critically injured patient ________ (die) before the ambulance doctor arrived.", a: ["had died"], exp: expPastPerf },
            { q: "He ________ (study) English for three years before he traveled to London.", a: ["had been studying"], exp: expPastPerfCont },
            { q: "Christopher Columbus ________ (discover) America in 1492.", a: ["discovered"], exp: expPastIndef },
            { q: "I ________ (not / listen) to the teacher when she suddenly called my name.", a: ["was not listening", "wasn't listening"], exp: expPastCont },
            { q: "She was extremely angry because someone ________ (steal) her designer purse.", a: ["had stolen"], exp: expPastPerf },
            { q: "Her eyes were completely red; she ________ (cry) all evening.", a: ["had been crying"], exp: expPastPerfCont },
            { q: "We ________ (visit) the national science museum yesterday afternoon.", a: ["visited"], exp: expPastIndef },
            { q: "The neighbor's dogs ________ (bark) loudly all night long.", a: ["were barking"], exp: expPastCont },
            { q: "By the time I woke up, my parents ________ (already / leave) for the office.", a: ["had already left"], exp: expPastPerf },
            { q: "They ________ (date) for five years before they finally got married.", a: ["had been dating"], exp: expPastPerfCont },
            { q: "The head chef ________ (cook) a delicious traditional meal for the guests last night.", a: ["cooked"], exp: expPastIndef },
            { q: "I ________ (walk) peacefully through the park when it started to pour rain.", a: ["was walking"], exp: expPastCont },
            { q: "He failed the final test because he ________ (not / study) the material at all.", a: ["had not studied", "hadn't studied"], exp: expPastPerf },
            { q: "We ________ (discuss) the complex problem for hours without finding a solution.", a: ["had been discussing"], exp: expPastPerfCont },
            { q: "The tech company ________ (launch) its new flagship product in 2021.", a: ["launched"], exp: expPastIndef },
            { q: "She ________ (paint) the living room walls while he was mowing the front lawn.", a: ["was painting"], exp: expPastCont }
        ];

        const container = document.getElementById('questionsContainer');
        
        quizData.forEach((item, index) => {
            const block = document.createElement('div');
            block.className = 'question-block';
            const parts = item.q.split('________');
            block.innerHTML = `
                <div class="question-text">${index + 1}. ${parts[0]} <input type="text" id="q${index}" class="ans-input" autocomplete="off" placeholder="your answer"> ${parts[1]}</div>
            `;
            container.appendChild(block);
        });

        function submitExamData() {
            const name = document.getElementById('studentName').value.trim();
            const batch = document.getElementById('studentBatch').value;
            const mobile = document.getElementById('studentMobile').value.trim();
            const totalQuestions = quizData.length;

            if (!name || !batch || !mobile) {
                alert("Please fill in your Name, Batch, and Mobile Number at the top of the page before submitting.");
                return;
            }
            if (!/^\d{10}$/.test(mobile)) {
                alert("Please enter a valid 10-digit mobile number.");
                return;
            }
            
            currentScore = 0;
            questionsAttempted = 0;
            
            quizData.forEach((item, index) => {
                const inputElement = document.getElementById(`q${index}`);
                const userAnswer = inputElement.value.trim().toLowerCase().replace(/\s+/g, ' ');
                if (userAnswer !== "") {
                    questionsAttempted++;
                    if (item.a.some(ans => ans.toLowerCase() === userAnswer)) {
                        currentScore++;
                    }
                }
            });

            if (questionsAttempted < totalQuestions) {
                const wantToSubmit = confirm(`You have attempted only ${questionsAttempted} questions out of ${totalQuestions}. Do you still want to submit?`);
                if (!wantToSubmit) { return; }
            }

            // 1. Change the button state and forcefully apply CSS so it visually repaints
            const submitBtn = document.getElementById('finalSubmitBtn');
            submitBtn.textContent = "Submitting Data... Please Wait";
            submitBtn.disabled = true;
            submitBtn.style.backgroundColor = "#9fa8da";
            submitBtn.style.cursor = "not-allowed";

            // 2. Lock inputs
            quizData.forEach((_, index) => {
                document.getElementById(`q${index}`).disabled = true;
            });

            // 3. Pause for 100 milliseconds to let the button visually change on screen before fetching
            setTimeout(() => {
                const scriptURL = 'https://script.google.com/macros/s/AKfycbxsOEpHG0OI4ktJfhFKEzqsKZNqLqXwuTlR-kMmtbBjCCsZVSMseNYVCBQSA222ANmt/exec';
                const formData = new FormData();
                formData.append('Name', name);
                formData.append('Batch', batch);
                formData.append('Mobile', mobile);
                formData.append('Score', currentScore + '/' + totalQuestions);

                fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: formData })
                    .then(() => {
                        document.getElementById('finalResult').innerHTML = `
                            <h2>Exam Completed Successfully!</h2>
                            <p>Name: ${name} | Batch: ${batch}</p>
                            <p>Your Final Score:</p>
                            <div class="score-display">${currentScore} / ${totalQuestions}</div>
                            <p><em>Your score has been submitted to Verchas Academy.</em></p>
                            <button id="detailedAnalysisBtn" onclick="showDetailedAnalysis()" class="check-btn" style="margin-top: 15px;">Check Detailed Analysis</button>
                        `;
                        document.getElementById('finalResult').style.display = "block";
                        submitBtn.style.display = "none";
                    })
                    .catch(error => {
                        alert("An error occurred while saving your data.");
                        // Re-enable everything if the connection fails
                        submitBtn.textContent = "Submit Exam & Show Final Score";
                        submitBtn.disabled = false;
                        submitBtn.style.backgroundColor = "var(--primary)";
                        submitBtn.style.cursor = "pointer";
                        quizData.forEach((_, index) => {
                            document.getElementById(`q${index}`).disabled = false;
                        });
                    });
            }, 100); 
        }

        function showDetailedAnalysis() {
            const reportContainer = document.getElementById('detailedReport');
            let reportHTML = "<h3 style='text-align: center; color: var(--primary);'>Detailed Analysis</h3>";

            quizData.forEach((item, index) => {
                const inputElement = document.getElementById(`q${index}`);
                const userAnswerCheck = inputElement.value.trim().toLowerCase().replace(/\s+/g, ' ');
                const isCorrect = item.a.some(ans => ans.toLowerCase() === userAnswerCheck) && userAnswerCheck !== "";
                
                const status = isCorrect ? "<span class='correct'>✔ Correctly Answered</span>" : "<span class='incorrect'>✘ Wrong Answered</span>";
                
                reportHTML += `
                    <div class="question-block" style="background-color: #ffffff;">
                        <p style="font-size: 1.05rem;"><strong>Question ${index + 1}.</strong> ${item.q}</p>
                        <p>${status}. <strong>Correct Answer:</strong> <span style="color: #0d47a1;">${item.a[0]}</span></p>
                        <p><strong>Explanation:</strong> ${item.exp}</p>
                    </div>
                `;
            });

            reportContainer.innerHTML = reportHTML;
            reportContainer.style.display = "block";
            document.getElementById('detailedAnalysisBtn').style.display = "none";
        }
    </script>
</body>
</html>
