<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verchas Academy - Present Tenses (50 Questions)</title>
    <style>
        :root{--primary:#1a237e;--secondary:#ff8f00;--bg-color:#f4f7f6;--card-bg:#ffffff;--text-main:#333333;--border-color:#e0e0e0;}
        body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:var(--bg-color);color:var(--text-main);line-height:1.6;margin:0;padding:0;}
        header{background-color:var(--primary);color:white;padding:1.5rem 1rem;text-align:center;}
        .logo-container{display:flex;align-items:center;justify-content:center;gap:15px;margin-bottom:10px;flex-wrap:wrap;}
        .logo-container img{height:90px;} header h1{margin:0;font-size:clamp(1.5rem,5vw,2.2rem);} header h2{margin:5px 0 0 0;font-size:1.2rem;color:#bbdefb;}
        .container{max-width:850px;margin:20px auto;padding:15px;background:var(--card-bg);border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,0.08);}
        .student-form{background:#e8eaf6;padding:20px;border-radius:8px;margin-bottom:30px;border:2px solid var(--primary);}
        .student-form h3{margin-top:0;color:var(--primary);text-align:center;} .form-row{display:flex;gap:15px;flex-wrap:wrap;}
        .form-group{flex:1;min-width:200px;} .form-group label{display:block;font-weight:bold;margin-bottom:5px;}
        .form-group input,.form-group select{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;box-sizing:border-box;}
        .instructions{background:#fff8e1;padding:15px;border-left:5px solid var(--secondary);margin-bottom:30px;font-size:0.95rem;}
        .question-block{margin-bottom:25px;padding:15px;border:1px solid var(--border-color);border-radius:8px;background-color:#fafafa;}
        .question-text{font-size:1.1rem;font-weight:500;margin-bottom:15px;}
        input.ans-input{padding:8px 12px;font-size:1rem;border:2px solid #ccc;border-radius:4px;width:100%;max-width:220px;font-weight:bold;color:#0d47a1;}
        .action-row{display:flex;align-items:center;gap:15px;margin-top:15px;flex-wrap:wrap;}
        .check-btn{background-color:var(--secondary);color:white;border:none;padding:10px 20px;font-size:1rem;border-radius:5px;cursor:pointer;font-weight:bold;}
        .check-btn:disabled{background-color:#e0e0e0;color:#9e9e9e;cursor:not-allowed;} .feedback{font-size:1.05rem;font-weight:bold;}
        .correct{color:#2e7d32;} .incorrect{color:#c62828;}
        .explanation{display:none;margin-top:15px;padding:15px;background-color:#e3f2fd;border-left:4px solid #1976d2;border-radius:4px;color:#0d47a1;}
        .submit-section{text-align:center;margin-top:40px;padding-top:20px;border-top:2px dashed #ccc;}
        #finalSubmitBtn{background-color:var(--primary);color:white;padding:15px 30px;font-size:1.2rem;border:none;border-radius:8px;cursor:pointer;font-weight:bold;width:100%;max-width:400px;}
        #finalResult{display:none;background-color:#e8f5e9;border:2px solid #4caf50;padding:20px;border-radius:8px;margin-top:20px;} .score-display{font-size:2.5rem;font-weight:bold;color:#1b5e20;}
    </style>
</head>
<body>
    <header>
        <div class="logo-container"><img src="verchas-logo.webp" alt="Verchas Academy Logo"><h1>Verchas Academy, Ayodhya</h1></div>
        <h2>Present Tenses - Mixed Practice (50 Questions)</h2>
    </header>
    <div class="container">
        <div class="student-form">
            <h3>Student Details</h3>
            <div class="form-row">
                <div class="form-group"><label>Full Name</label><input type="text" id="studentName" required></div>
                <div class="form-group"><label>Batch</label><select id="studentBatch" required>
                    <option value="" disabled selected>Select Batch...</option><option value="9th Foundation">9th Foundation</option><option value="10th Foundation">10th Foundation</option><option value="BSc Nursing">BSc Nursing</option>
                </select></div>
                <div class="form-group"><label>Mobile No.</label><input type="tel" id="studentMobile" pattern="[0-9]{10}" maxlength="10" required></div>
            </div>
        </div>
        <div class="instructions"><strong>Instructions:</strong> Type the correct Present Tense form and click <strong>Check Answer</strong>.</div>
        <div id="questionsContainer"></div>
        <div class="submit-section">
            <button id="finalSubmitBtn" onclick="submitExamData()">Submit Exam & Show Final Score</button>
            <div id="finalResult"></div>
        </div>
    </div>
    <script>
        let currentScore = 0; let questionsAttempted = 0;
        
        const expIndef = "Present Indefinite: Used for daily habits, routines, or universal facts.";
        const expCont = "Present Continuous: Used for an action happening exactly at this moment of speaking.";
        const expPerf = "Present Perfect: Used for an action just completed, or a past action with a present result.";
        const expPerfCont = "Present Perfect Continuous: Used for an action that started in the past and is still happening now (clues: since/for).";

        const quizData = [
            { q: "The library ________ (open) at 8:00 AM every morning.", a: ["opens"], exp: expIndef },
            { q: "Look! The children ________ (play) in the mud outside.", a: ["are playing"], exp: expCont },
            { q: "I ________ (already / finish) my science project, so I can relax now.", a: ["have already finished"], exp: expPerf },
            { q: "The streets are flooded because it ________ (rain) heavily since morning.", a: ["has been raining"], exp: expPerfCont },
            { q: "Water ________ (boil) at 100 degrees Celsius.", a: ["boils"], exp: expIndef },
            { q: "I ________ (currently / read) an interesting book about space exploration.", a: ["am currently reading"], exp: expCont },
            { q: "________ (you / ever / visit) the Taj Mahal in Agra?", a: ["have you ever visited"], exp: expPerf },
            { q: "I am so tired! I ________ (wait) for the bus for over an hour!", a: ["have been waiting"], exp: expPerfCont },
            { q: "My brother usually ________ (drink) coffee, but today he is having tea.", a: ["drinks"], exp: expIndef },
            { q: "Why ________ (you / cry)? Is everything okay?", a: ["are you crying"], exp: expCont },
            { q: "She ________ (not / receive) the parcel yet.", a: ["has not received", "hasn't received"], exp: expPerf },
            { q: "How long ________ (she / practice) the piano today?", a: ["has she been practicing", "has she been practising"], exp: expPerfCont },
            { q: "They rarely ________ (visit) their grandparents on weekdays.", a: ["visit"], exp: expIndef },
            { q: "Please lower your voice; the baby ________ (sleep) in the next room.", a: ["is sleeping"], exp: expCont },
            { q: "We ________ (just / hear) the good news about your promotion!", a: ["have just heard"], exp: expPerf },
            { q: "They ________ (work) on this group presentation all week.", a: ["have been working"], exp: expPerfCont },
            { q: "The earth ________ (revolve) around the sun.", a: ["revolves"], exp: expIndef },
            { q: "They ________ (not / watch) TV right now; they are studying for exams.", a: ["are not watching", "aren't watching"], exp: expCont },
            { q: "He ________ (lose) his keys, so he cannot open the front door.", a: ["has lost"], exp: expPerf },
            { q: "He is completely out of breath because he ________ (run).", a: ["has been running"], exp: expPerfCont },
            { q: "________ (you / believe) in ghosts and spirits?", a: ["do you believe"], exp: expIndef },
            { q: "She ________ (prepare) a special dinner for tonight's party.", a: ["is preparing"], exp: expCont },
            { q: "The train ________ (already / leave) the platform.", a: ["has already left"], exp: expPerf },
            { q: "We ________ (not / watch) any television since the final exams started.", a: ["have not watched", "haven't watched"], exp: expPerf },
            { q: "She ________ (not / like) eating spicy food at all.", a: ["does not like", "doesn't like"], exp: expIndef },
            { q: "We ________ (stay) at a hotel until our house is fully renovated.", a: ["are staying"], exp: expCont },
            { q: "They ________ (know) each other since they were in kindergarten.", a: ["have known"], exp: expPerf },
            { q: "________ (you / exercise) lately? You look very fit!", a: ["have you been exercising"], exp: expPerfCont },
            { q: "The local bus always ________ (stop) at the corner of our street.", a: ["stops"], exp: expIndef },
            { q: "________ (it / rain) outside at this very moment?", a: ["is it raining"], exp: expCont },
            { q: "________ (she / complete) the math assignment yet?", a: ["has she completed"], exp: expPerf },
            { q: "My eyes are red because I ________ (stare) at the computer screen all day.", a: ["have been staring"], exp: expPerfCont },
            { q: "My mother always ________ (pack) a healthy lunch for me.", a: ["packs"], exp: expIndef },
            { q: "The mechanic ________ (fix) my car right now.", a: ["is fixing"], exp: expCont },
            { q: "I ________ (never / eat) authentic Japanese sushi before.", a: ["have never eaten"], exp: expPerf },
            { q: "The head chef ________ (cook) for the wedding feast since 5 AM.", a: ["has been cooking"], exp: expPerfCont },
            { q: "________ (he / play) the guitar well?", a: ["does he play"], exp: expIndef },
            { q: "My friends ________ (plan) a surprise birthday party for me these days.", a: ["are planning"], exp: expCont },
            { q: "Our cricket team ________ (win) three matches so far this tournament.", a: ["has won"], exp: expPerf },
            { q: "She ________ (live) in Ayodhya for the last ten years.", a: ["has been living"], exp: expPerfCont },
            { q: "We often ________ (go) for a walk after having dinner.", a: ["go"], exp: expIndef },
            { q: "I ________ (listen) to an educational podcast right now.", a: ["am listening"], exp: expCont },
            { q: "The teacher ________ (grade) all the English exam papers.", a: ["has graded"], exp: expPerf },
            { q: "The neighborhood dogs ________ (bark) continuously for the past twenty minutes.", a: ["have been barking"], exp: expPerfCont },
            { q: "It ________ (snow) heavily in Kashmir during the winter months.", a: ["snows"], exp: expIndef },
            { q: "He ________ (not / use) his laptop at the moment, so you can borrow it.", a: ["is not using", "isn't using"], exp: expCont },
            { q: "I ________ (read) three chapters of this novel so far today.", a: ["have read"], exp: expPerf },
            { q: "I ________ (try) to call your mobile phone all morning!", a: ["have been trying"], exp: expPerfCont },
            { q: "________ (you / see) my reading spectacles anywhere?", a: ["have you seen"], exp: expPerf },
            { q: "How long ________ (they / discuss) this issue in the boardroom?", a: ["have they been discussing"], exp: expPerfCont }
        ];

        const container = document.getElementById('questionsContainer');
        quizData.forEach((item, index) => {
            const block = document.createElement('div'); block.className = 'question-block'; const parts = item.q.split('________');
            block.innerHTML = `<div class="question-text">${index + 1}. ${parts[0]} <input type="text" id="q${index}" class="ans-input" autocomplete="off" placeholder="your answer"> ${parts[1]}</div>
                <div class="action-row"><button class="check-btn" id="btn${index}" onclick="checkAnswer(${index})">Check Answer</button><span class="feedback" id="feedback${index}"></span></div>
                <div class="explanation" id="exp${index}"><strong>Explanation:</strong><br> ${item.exp}</div>`;
            container.appendChild(block);
        });

        function checkAnswer(index) {
            const item = quizData[index]; const inputElement = document.getElementById(`q${index}`); const feedbackElement = document.getElementById(`feedback${index}`); const btnElement = document.getElementById(`btn${index}`); const expElement = document.getElementById(`exp${index}`);
            const userAnswer = inputElement.value.trim().toLowerCase().replace(/\s+/g, ' '); const isCorrect = item.a.some(ans => ans.toLowerCase() === userAnswer);
            inputElement.disabled = true; btnElement.disabled = true; btnElement.textContent = "Checked"; questionsAttempted++;
            if (isCorrect) { currentScore++; inputElement.style.borderColor = "#2e7d32"; inputElement.style.backgroundColor = "#e8f5e9"; inputElement.style.color = "#1b5e20"; feedbackElement.textContent = "✔ Correct!"; feedbackElement.className = "feedback correct"; } 
            else { inputElement.style.borderColor = "#c62828"; inputElement.style.backgroundColor = "#ffebee"; inputElement.style.color = "#b71c1c"; feedbackElement.innerHTML = `✘ Incorrect. Correct: <strong>${item.a[0]}</strong>`; feedbackElement.className = "feedback incorrect"; }
            expElement.style.display = "block";
        }

        function submitExamData() {
            const name = document.getElementById('studentName').value.trim(); 
            const batch = document.getElementById('studentBatch').value; 
            const mobile = document.getElementById('studentMobile').value.trim();
            
            if (!name || !batch || !mobile) { 
                alert("Please fill in your Name, Batch, and Mobile Number."); 
                return; 
            }
            if (!/^\d{10}$/.test(mobile)) { 
                alert("Please enter a valid 10-digit mobile number."); 
                return; 
            }
            
            if (questionsAttempted < 50) {
                const wantToSubmit = confirm(`You have attempted only ${questionsAttempted} questions out of 50. Do you still want to submit?`);
                if (!wantToSubmit) {
                    return; 
                }
            }

            const submitBtn = document.getElementById('finalSubmitBtn'); 
            submitBtn.textContent = "Submitting Data... Please wait"; 
            submitBtn.disabled = true;
            
            const scriptURL = 'https://script.google.com/macros/s/AKfycbxsOEpHG0OI4ktJfhFKEzqsKZNqLqXwuTlR-kMmtbBjCCsZVSMseNYVCBQSA222ANmt/exec'; 
            
            const formData = new FormData(); 
            formData.append('Name', name); 
            formData.append('Batch', batch); 
            formData.append('Mobile', mobile); 
            formData.append('Score', currentScore + '/50'); 

            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: formData })
                .then(() => {
                    document.getElementById('finalResult').innerHTML = `<h2>Exam Completed!</h2><p>Name: ${name} | Batch: ${batch}</p><p>Your Final Score:</p><div class="score-display">${currentScore} / 50</div>`;
                    document.getElementById('finalResult').style.display = "block"; 
                    submitBtn.style.display = "none";
                }).catch(error => { 
                    alert("Error saving data. Please check your internet connection."); 
                    submitBtn.textContent = "Submit Exam & Show Final Score"; 
                    submitBtn.disabled = false; 
                });
        }
    </script>
</body>
</html>
